[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcube"
version = "0.1.0"
description = "Institutional flow prediction for NSE/BSE index derivatives"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.17",
    "google-cloud-storage>=2.14",
    "db-dtypes>=1.2",
]
broker = [
    "kiteconnect>=4.2",
    "websockets>=12.0",
]
dev = [
    "pytest>=7.4",
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
